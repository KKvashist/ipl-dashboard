apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ipl-backend:latest
          ports:
            - containerPort: 4000
          env:
            - name: DATABASE_URL
              value: postgresql://ipl_user:ipl_password@postgres:5432/ipl_dashboard
            - name: PORT
              value: "4000"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000