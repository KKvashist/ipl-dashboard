version: "3.9"

services:
  postgres:
    image: postgres:18-alpine
    container_name: ipl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ipl_user
      POSTGRES_PASSWORD: ipl_password
      POSTGRES_DB: ipl_dashboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipl_user -d ipl_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: ipl-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ipl_user:ipl_password@postgres:5432/ipl_dashboard
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    container_name: ipl-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata: